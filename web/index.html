<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HUTECH Event Intelligence - Khám phá, đăng ký và quản lý sự kiện sinh viên.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HUTECH Events">
  <link rel="apple-touch-icon" href="hutech_mark.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="hutech_mark.svg"/>

  <title>HUTECH Event Intelligence</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="startup" role="status" aria-label="Đang mở HUTECH Events"
    style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(135deg,#f4f9ff 10%,#fff 60%,#fff7d6);font-family:Arial,sans-serif;color:#153252">
    <img src="hutech_mark.svg" width="112" height="112" alt="HUTECH University" style="object-fit:contain">
    <p style="font-weight:700;font-size:20px;margin:24px 0 8px">HUTECH Event Intelligence</p>
    <p style="font-size:13px;color:#718096">Đang mở không gian trải nghiệm của bạn…</p>
  </div>
  <script>
    // Pinned PDF.js 6.2.108 is served with the app; reports stay in the browser.
    window.dartPdfJsBaseUrl = new URL('pdfjs/', document.baseURI).href;
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('startup')?.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
